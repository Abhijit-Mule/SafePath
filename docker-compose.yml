services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-safepath}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-safepath-local-secret}
    volumes:
      - object_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done; mc mb --ignore-existing local/safepath-reports; mc anonymous set download local/safepath-reports"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-safepath}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-safepath-local-secret}

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      MODEL_PATH: /app/models/pothole-yolov8s.pt
      MODEL_URL: https://huggingface.co/peterhdd/pothole-detection-yolov8/resolve/main/best.pt
      CONFIDENCE_THRESHOLD: 0.35
      MAX_IMAGE_BYTES: 8388608
      POTHOLE_CLASSES: pothole,potholes
    volumes:
      - model_data:/app/models

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/safepath
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      AI_SERVICE_URL: http://ai-service:8000
      CLIENT_ORIGIN: http://localhost
      S3_BUCKET: safepath-reports
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-safepath}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-safepath-local-secret}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: http://localhost:9000/safepath-reports
    depends_on:
      - mongo
      - ai-service
      - minio-init

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
  object_data:
  model_data:
