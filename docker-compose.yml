services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      MODEL_PATH: /app/models/pothole-yolov8s.pt
      MODEL_URL: https://huggingface.co/peterhdd/pothole-detection-yolov8/resolve/main/best.pt
      CONFIDENCE_THRESHOLD: 0.35
      MAX_IMAGE_BYTES: 8388608
      POTHOLE_CLASSES: pothole,potholes
    volumes:
      - model_data:/app/models
    depends_on:
      - mongo

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/safepath
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      AI_SERVICE_URL: http://ai-service:8000
      CLIENT_ORIGIN: http://localhost
      S3_BUCKET: ${S3_BUCKET:-safepath-reports}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    depends_on:
      - mongo
      - ai-service

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
  model_data:
